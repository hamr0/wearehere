<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="loading">scanning...</div>

  <div id="report" hidden>
    <div id="brand">
      <svg id="brand-icon" viewBox="12 25 104 78" height="20" aria-hidden="true">
        <path d="M 28 30 L 16 30 L 16 98 L 28 98" stroke="currentColor" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-linecap="butt"/>
        <path d="M 100 30 L 112 30 L 112 98 L 100 98" stroke="currentColor" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-linecap="butt"/>
        <text x="64" y="64" font-size="58" font-weight="800" text-anchor="middle" dominant-baseline="central" letter-spacing="-2"
              font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,'Courier New',monospace"
              fill="currentColor">we</text>
      </svg><span id="brand-name">arehere</span>
    </div>
    <header id="head">
      <span id="site"></span>
      <span id="score"></span>
    </header>
    <div id="verdict"></div>

    <section id="watchers-block">
      <div class="block-title">who's watching</div>
      <div id="watchers"></div>
      <div id="chips"></div>
    </section>

    <div id="footer-chips"></div>

    <section id="guard-card">
      <div class="block-title">privacy guard</div>
      <div id="guard-site"></div>
      <div id="guard-cookies-line"></div>
      <div id="guard-blur-line"></div>
      <div id="guard-actions">
        <button class="btn" id="trust-toggle">[ trust cookies 30d ]</button>
        <button class="btn" id="trust-id">[ trust ID ]</button>
      </div>
      <div id="guard-status"></div>
      <div id="guard-counters"></div>
    </section>

    <button id="full-report">[ open full dashboard ]</button>
  </div>

  <div id="empty" hidden>
    <div class="empty-title">no data yet</div>
    <div class="empty-sub">navigate to a website to scan it.</div>
  </div>

  <div id="needs-permission" hidden>
    <div class="empty-title">site access needed</div>
    <div class="empty-sub">wearehere just got permission. reload this tab so it can scan from page load.</div>
    <button id="reload-tab" class="btn-mini" type="button">[ reload tab ]</button>
    <button id="open-settings" class="btn-mini" type="button">[ open extension settings ]</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
