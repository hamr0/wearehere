<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wearehere — dashboard</title>
  <link rel="icon" type="image/png" href="icons/icon48.png">
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <div id="loading">loading dashboard...</div>

  <div id="report" hidden>
    <header id="header">
      <div id="brand">
        <svg id="brand-icon" viewBox="12 25 104 78" height="22" aria-hidden="true">
          <path d="M 28 30 L 16 30 L 16 98 L 28 98" stroke="currentColor" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-linecap="butt"/>
          <path d="M 100 30 L 112 30 L 112 98 L 100 98" stroke="currentColor" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-linecap="butt"/>
          <text x="64" y="64" font-size="58" font-weight="800" text-anchor="middle" dominant-baseline="central" letter-spacing="-2"
                font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,'Courier New',monospace"
                fill="currentColor">we</text>
        </svg><span id="brand-name">arehere</span>
      </div>
      <div id="header-controls">
        <button id="theme-toggle" type="button" aria-label="Toggle theme">[ dark ]</button>
        <select id="tab-select" aria-label="Switch tab"></select>
      </div>
    </header>

    <nav id="tab-bar" role="tablist">
      <button class="tab active" data-tab="overview" role="tab" aria-selected="true">overview</button>
      <button class="tab" data-tab="watchers" role="tab" aria-selected="false">watchers</button>
      <button class="tab" data-tab="scoper" role="tab" aria-selected="false">cookie scoper</button>
    </nav>

    <main>
      <section id="panel-overview" class="panel active" role="tabpanel"></section>
      <section id="panel-watchers" class="panel" role="tabpanel" hidden></section>
      <section id="panel-scoper" class="panel" role="tabpanel" hidden></section>
    </main>
  </div>

  <div id="empty" hidden>
    <div class="empty-title">no data yet</div>
    <div class="empty-sub">visit a few sites first, then come back here.</div>
  </div>

  <script src="report.js"></script>
</body>
</html>
