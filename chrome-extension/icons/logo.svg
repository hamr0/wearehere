<!-- wearehere logo · variant D · [we]
     Brackets drawn as filled rectangles, not stroked paths — stroked
     paths anti-aliased the right bracket visibly heavier than the left
     at 48px/128px. Rectangles give symmetric pixel coverage. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="currentColor">
  <!-- Left bracket [ -->
  <rect x="11" y="25" width="10" height="78"/>
  <rect x="11" y="25" width="20" height="10"/>
  <rect x="11" y="93" width="20" height="10"/>
  <!-- Right bracket ] -->
  <rect x="107" y="25" width="10" height="78"/>
  <rect x="97"  y="25" width="20" height="10"/>
  <rect x="97"  y="93" width="20" height="10"/>
  <!-- 'we' -->
  <text x="64" y="64" font-size="58" font-weight="800" text-anchor="middle" dominant-baseline="central" letter-spacing="-2"
        font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,'Courier New',monospace">we</text>
</svg>
